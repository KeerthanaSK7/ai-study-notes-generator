version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: study-notes-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: study-notes-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/study-notes
      PORT: 5000
      NODE_ENV: development
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: study-notes-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data: